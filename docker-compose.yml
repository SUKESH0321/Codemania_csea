services:
  # ─────────────────────────────────────────────
  # Frontend — Vite/React served by nginx
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the Vite bundle at build time.
        # They must point to where the BROWSER can reach the APIs.
        VITE_CORE_BACKEND_URL: ${VITE_CORE_BACKEND_URL:-http://localhost:5000}
        VITE_EXECUTION_SERVER_URL: ${VITE_EXECUTION_SERVER_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - codemania-network

  # ─────────────────────────────────────────────
  # Backend Core — Express API + Socket.io
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
